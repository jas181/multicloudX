name: Validate infrastructure
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform/environments/dev } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false
      - run: terraform validate
  policy-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: instrumenta/conftest-action@master
        with: { files: policies/tests }
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: terraform, config_file: .checkov.yml, soft_fail: true }
      - uses: returntocorp/semgrep-action@v1
        with: { config: .semgrep.yml }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: config, scan-ref: . }
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: yannh/kubeconform@v1.6.4
        with:
          args: "-summary -strict -ignore-missing-schemas kubernetes/base"
      - run: helm lint kubernetes/charts/platform-sample
