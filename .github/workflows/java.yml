name: Build and scan services
on:
  pull_request:
    paths: ["applications/**"]
  push:
    branches: [main, develop]
    paths: ["applications/**"]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify
      - name: OWASP dependency scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: multicloudx-services
          path: applications
          format: HTML
          args: --failOnCVSS 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports
      - name: Build container images
        run: |
          for service in customer-service order-service payment-service notification-service; do
            docker build --tag "multicloudx/${service}:${{ github.sha }}" "${service}"
          done
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: multicloudx/customer-service:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
