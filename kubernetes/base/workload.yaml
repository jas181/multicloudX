apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: multicloudx
data:
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-sample
  namespace: multicloudx
spec:
  replicas: 2
  selector:
    matchLabels: { app: platform-sample }
  template:
    metadata:
      labels: { app: platform-sample }
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: application
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ configMapRef: { name: platform-config } }]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: platform-runtime
                  key: database-url
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5 }
          volumeMounts:
            - name: runtime
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: runtime
          emptyDir: {}
        - name: data
          persistentVolumeClaim: { claimName: platform-data }
---
apiVersion: v1
kind: Service
metadata: { name: platform-sample, namespace: multicloudx }
spec:
  selector: { app: platform-sample }
  ports: [{ port: 8080, targetPort: http, name: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: platform-sample, namespace: multicloudx }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: platform-sample } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: platform-sample, namespace: multicloudx }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: platform-sample }
  minReplicas: 2
  maxReplicas: 5
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: multicloudx }
spec:
  podSelector: {}
  policyTypes: [Ingress]
