spring:
  application: { name: customer-service }
  datasource: { url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/customer}, username: ${DATABASE_USERNAME:customer}, password: ${DATABASE_PASSWORD:} }
  jpa: { hibernate: { ddl-auto: validate }, open-in-view: false }
management:
  endpoints: { web: { exposure: { include: health,info,metrics,prometheus } } }
  endpoint: { health: { probes: { enabled: true } } }
logging: { structured: { format: { console: logstash } } }
